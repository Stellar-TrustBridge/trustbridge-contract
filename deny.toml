# cargo-deny configuration for trustbridge-contract
#
# Run: cargo deny --config deny.toml check   (CI job `cargo-deny`)
# Install: cargo install --locked cargo-deny@0.20.2
#
# Uses the cargo-deny v2 config schema: vulnerability advisories and
# unlicensed crates are always errors; the removed v1 keys
# (`vulnerability`, `notice`, `unlicensed`) are no longer accepted.

[advisories]
version = 2
# Unmaintained advisories fail only for direct dependencies.
unmaintained = "workspace"
yanked = "warn"
ignore = []

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
]
# wasmparser is a soroban-env dependency; LLVM-exception only adds
# permissions to Apache-2.0, so it is allowed for these crates alone.
exceptions = [
    { crate = "wasmparser", allow = ["Apache-2.0 WITH LLVM-exception"] },
    { crate = "wasmparser-nostd", allow = ["Apache-2.0 WITH LLVM-exception"] },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
