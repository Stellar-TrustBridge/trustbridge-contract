# cargo-deny configuration for trustbridge-contract
#
# Run: cargo deny --config deny.toml check   (CI job `cargo-deny`)
# Install: cargo install --locked cargo-deny@0.20.2
#
# Uses the cargo-deny v2 config schema: vulnerability advisories and
# unlicensed crates are always errors; the removed v1 keys
# (`vulnerability`, `notice`, `unlicensed`) are no longer accepted.

[advisories]
version = 2
# Unmaintained advisories fail only for direct dependencies.
unmaintained = "workspace"
yanked = "warn"
# RUSTSEC-2026-0387 (crypto-bigint): operations intended to be constant-time
# can take secret-dependent branches (timing side channel, crypto-failure).
#
# Why ignored — no compatible fix exists today:
#   * The advisory is patched only in crypto-bigint >= 0.7.6.
#   * Our only path to crypto-bigint is elliptic-curve 0.13.8 (via k256/p256
#     via soroban-env-host), which pins crypto-bigint ^0.5. Semver-bound,
#     `cargo update -p crypto-bigint` stays inside 0.5.x (verified with
#     --dry-run; latest 0.5.x = 0.5.5, already resolved, no backport).
#   * The newest soroban-env-host releases (through 30.0.0, Oct 2026) still
#     pin elliptic-curve ^0.13.5, so no soroban upgrade closes this either.
#   * A [patch] section overriding crypto-bigint to 0.7.x cannot compile:
#     elliptic-curve 0.13's API is written against 0.5 types.
# Risk posture:
#   * The contract calls none of the elliptic-curve/secp256 built-ins where
#     this code lives (grep for secp256 in src/ and tests/ is empty); the
#     affected arithmetic is not exercised by TrustBridge logic.
#   * Advisory class is timing variability, not key recovery; no known exploit.
# Removal condition — delete this ignore (and re-run `cargo deny check`)
# when soroban-env-host ships a release built on elliptic-curve >= 0.14
# (crypto-bigint >= 0.7.6), then bump soroban-sdk and drop the pin comment.
ignore = [
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint <0.7.6 timing advisory; no compatible fix: pinned by soroban's elliptic-curve ^0.13 chain; unreached code path (no secp256 builtins used)" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
]
# wasmparser is a soroban-env dependency; LLVM-exception only adds
# permissions to Apache-2.0, so it is allowed for these crates alone.
exceptions = [
    { crate = "wasmparser", allow = ["Apache-2.0 WITH LLVM-exception"] },
    { crate = "wasmparser-nostd", allow = ["Apache-2.0 WITH LLVM-exception"] },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
