"""
TrustBridge registry subgraph schema (Issues #284, #386).

Covers every contract event that names a contributor — `RegisteredEvent`,
`VerifiedEvent`, `VerificationRevokedEvent`, `RemovedEvent`, `RenamedEvent`,
and the challenge and address-rotation lifecycles — plus the derived
`Contributor` aggregate, so a dashboard can reconstruct contributor history
without a bespoke indexer. Operational events that do not name a contributor
(pause/unpause, role grants, batch-remove proposals, guardian changes, WASM
upgrades and attestations) are intentionally not modelled here: they are
telemetry about the contract instance itself, not about a contributor, and
remain queryable in the raw event log produced by
[`scripts/event_indexer.sh`](../../scripts/event_indexer.sh).

Field names and types mirror the on-chain `#[contractevent]` definitions in
`src/events.rs` exactly — see docs/subgraph/README.md for the event -> entity
mapping. No payload field here is invented; anything the contract does not emit
is not modelled.

This schema is written in the Graph Protocol subgraph dialect (entity
directives, `Bytes`, `BigInt`). It is a schema + mapping spec only; operating a
hosted indexer is out of scope for this repo.
"""

"""
Deployment provenance carried by RegisteredEvent (Issue #373), VerifiedEvent and
RemovedEvent (`EventDomain`, Issue #226).
Embedded, not a top-level entity: it has no identity of its own.
"""
type EventDomain {
  "Emitting contract instance (C... address)."
  contractId: Bytes!
  "SHA-256 of the network passphrase."
  networkId: Bytes!
  "Contract version at emit time, as [major, minor, patch]."
  contractVersion: [Int!]!
  "Schema version of the domain envelope itself. Currently 1."
  domainVersion: Int!
}

"""
One `RegisteredEvent`: a GitHub username registered or re-registered to a
Stellar address. Topic: `registered_event`. `github_username` is the event
topic. `sponsor` is present only when a third party paid for the registration.
"""
type RegisteredEvent @entity(immutable: true) {
  "Stable event id: {networkId}:{contractId}:{ledgerSequence}:{txHash}:{eventIndex} (Issue #283)."
  id: ID!
  githubUsername: String!
  stellarAddress: Bytes!
  timestamp: BigInt!
  sponsor: Bytes
  "Null only for registrations emitted before 1.1.0 (Issue #373)."
  domain: EventDomain
  ledgerSequence: BigInt!
  txHash: Bytes!
  contributor: Contributor!
}

"""
One `VerifiedEvent`: an admin or Verifier marked a contributor verified.
Topic: `verified_event`. `github_username` is the event topic.
"""
type VerifiedEvent @entity(immutable: true) {
  "Stable event id (Issue #283)."
  id: ID!
  githubUsername: String!
  stellarAddress: Bytes!
  timestamp: BigInt!
  domain: EventDomain!
  ledgerSequence: BigInt!
  txHash: Bytes!
  contributor: Contributor!
}

"""
One `VerificationRevokedEvent`: an admin, Verifier, or Revoker cleared a
contributor's verified status. Topic: `verification_revoked_event`.
`github_username` is the event topic. `reason_code` is a numeric `RevokeReason`
discriminant (see docs/ABI.md).
"""
type VerificationRevokedEvent @entity(immutable: true) {
  "Stable event id (Issue #283)."
  id: ID!
  githubUsername: String!
  stellarAddress: Bytes!
  timestamp: BigInt!
  "Numeric `RevokeReason` discriminant (1–6, 99)."
  reasonCode: Int!
  domain: EventDomain!
  ledgerSequence: BigInt!
  txHash: Bytes!
  contributor: Contributor!
}

"""
One `RemovedEvent`: a registration removed by the registrant or an admin.
Topic: `removed_event`. `github_username` is the event topic. A large
`batch_remove` emits one `RemovedEvent` per successfully removed contributor,
all in the same transaction — `eventIndex` in the `id` keeps them distinct.
"""
type RemovedEvent @entity(immutable: true) {
  "Stable event id (Issue #283)."
  id: ID!
  githubUsername: String!
  stellarAddress: Bytes!
  timestamp: BigInt!
  domain: EventDomain!
  ledgerSequence: BigInt!
  txHash: Bytes!
  contributor: Contributor!
}

"""
One `RenamedEvent`: a registration's GitHub username was changed from
`old_username` to `new_username`. Both usernames are event topics.
`verification_cleared` reports whether the rename also cleared the
contributor's verified status. Topic: `renamed_event`.
"""
type RenamedEvent @entity(immutable: true) {
  "Stable event id (Issue #283)."
  id: ID!
  oldUsername: String!
  newUsername: String!
  stellarAddress: Bytes!
  "Whether the verified flag was cleared by the rename."
  verificationCleared: Boolean!
  timestamp: BigInt!
  ledgerSequence: BigInt!
  txHash: Bytes!
  "The contributor being renamed, keyed by `old_username` — see README."
  contributor: Contributor!
}

"""
One `ChallengeStartedEvent`: an admin opened a challenge on a squatted
username (Issue #214). Topic: `challenge_started_event`. `github_username` is
the event topic; `resolve_after` is the ledger timestamp after which the
challenge may be completed.
"""
type ChallengeStartedEvent @entity(immutable: true) {
  "Stable event id (Issue #283)."
  id: ID!
  githubUsername: String!
  challengedBy: Bytes!
  resolveAfter: BigInt!
  timestamp: BigInt!
  domain: EventDomain!
  ledgerSequence: BigInt!
  txHash: Bytes!
  contributor: Contributor!
}

"""
One `ChallengeCancelledEvent`: an admin cancelled a pending challenge
(Issue #214). Topic: `challenge_cancelled_event`. `github_username` is the
event topic.
"""
type ChallengeCancelledEvent @entity(immutable: true) {
  "Stable event id (Issue #283)."
  id: ID!
  githubUsername: String!
  cancelledBy: Bytes!
  timestamp: BigInt!
  domain: EventDomain!
  ledgerSequence: BigInt!
  txHash: Bytes!
  contributor: Contributor!
}

"""
One `ChallengeCompletedEvent`: an admin completed a challenge and the squatted
registration was removed (Issue #214). Topic: `challenge_completed_event`.
`github_username` is the event topic. A completed challenge also emits a
`RemovedEvent` in the same transaction.
"""
type ChallengeCompletedEvent @entity(immutable: true) {
  "Stable event id (Issue #283)."
  id: ID!
  githubUsername: String!
  completedBy: Bytes!
  timestamp: BigInt!
  domain: EventDomain!
  ledgerSequence: BigInt!
  txHash: Bytes!
  contributor: Contributor!
}

"""
One `RotationRequestedEvent`: an address rotation for `github_username` was
requested and is waiting out its delay (Issue #234). Topic:
`rotation_requested_event`. `github_username` is the event topic;
`executable_at` is the earliest ledger timestamp at which the rotation may be
executed. Rotation events carry no `domain` field (see README).
"""
type RotationRequestedEvent @entity(immutable: true) {
  "Stable event id (Issue #283)."
  id: ID!
  githubUsername: String!
  currentAddress: Bytes!
  newAddress: Bytes!
  executableAt: BigInt!
  timestamp: BigInt!
  ledgerSequence: BigInt!
  txHash: Bytes!
  contributor: Contributor!
}

"""
One `RotationExecutedEvent`: a pending address rotation was executed
(Issue #234). Topic: `rotation_executed_event`. `github_username` is the event
topic.
"""
type RotationExecutedEvent @entity(immutable: true) {
  "Stable event id (Issue #283)."
  id: ID!
  githubUsername: String!
  oldAddress: Bytes!
  newAddress: Bytes!
  timestamp: BigInt!
  ledgerSequence: BigInt!
  txHash: Bytes!
  contributor: Contributor!
}

"""
One `RotationCancelledEvent`: a pending address rotation was cancelled
(Issue #234). Topic: `rotation_cancelled_event`. `github_username` is the
event topic.
"""
type RotationCancelledEvent @entity(immutable: true) {
  "Stable event id (Issue #283)."
  id: ID!
  githubUsername: String!
  cancelledBy: Bytes!
  timestamp: BigInt!
  ledgerSequence: BigInt!
  txHash: Bytes!
  contributor: Contributor!
}

"""
One `BotStatusChangedEvent`: an admin or the registrant updated the bot flag for
a contributor (Issue #236). Topic: `bot_status_changed_event`. `github_username`
is the event topic.
"""
type BotStatusChangedEvent @entity(immutable: true) {
  "Stable event id (Issue #283)."
  id: ID!
  githubUsername: String!
  isBot: Boolean!
  actor: Bytes!
  timestamp: BigInt!
  domain: EventDomain!
  ledgerSequence: BigInt!
  txHash: Bytes!
  contributor: Contributor!
}

"""
Derived, mutable aggregate: current best-known state of one GitHub username on
one contract instance. Rebuilt by the mappings from the event stream; the
contract's own storage remains the source of truth for reconciliation.
"""
type Contributor @entity {
  "The GitHub username (lower-cased, as stored on-chain)."
  id: ID!
  githubUsername: String!
  "Address from the most recent RegisteredEvent, or null once removed."
  stellarAddress: Bytes
  "True after a VerifiedEvent, false after a RemovedEvent or before first verify."
  verified: Boolean!
  "False until a RemovedEvent with no later RegisteredEvent."
  removed: Boolean!
  "True if marked as a bot account (Issue #236)."
  isBot: Boolean!
  firstRegisteredAt: BigInt
  lastEventAt: BigInt!
  lastLedgerSequence: BigInt!
  registrations: [RegisteredEvent!]! @derivedFrom(field: "contributor")
  botStatusChanges: [BotStatusChangedEvent!]! @derivedFrom(field: "contributor")
  verifications: [VerifiedEvent!]! @derivedFrom(field: "contributor")
  revocations: [VerificationRevokedEvent!]! @derivedFrom(field: "contributor")
  removals: [RemovedEvent!]! @derivedFrom(field: "contributor")
  renames: [RenamedEvent!]! @derivedFrom(field: "contributor")
  challengesStarted: [ChallengeStartedEvent!]! @derivedFrom(field: "contributor")
  challengesCancelled: [ChallengeCancelledEvent!]! @derivedFrom(field: "contributor")
  challengesCompleted: [ChallengeCompletedEvent!]! @derivedFrom(field: "contributor")
  rotationsRequested: [RotationRequestedEvent!]! @derivedFrom(field: "contributor")
  rotationsExecuted: [RotationExecutedEvent!]! @derivedFrom(field: "contributor")
  rotationsCancelled: [RotationCancelledEvent!]! @derivedFrom(field: "contributor")
}