name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  # WASM size budget (bytes).
  #
  # Current optimised release size is ~85 KB. The hard limit is set at 200 KB
  # to leave generous headroom for intentional feature growth while still
  # catching accidental binary bloat (e.g. pulling in an unintended dependency
  # or disabling LTO).
  #
  # To raise the limit after an intentional feature addition:
  #   1. Measure the new size with `make wasm-size` locally.
  #   2. Update WASM_SIZE_LIMIT below with the new ceiling (round up to the
  #      nearest 10 KB and add ~20 KB headroom).
  #   3. Update the "WASM size budget" section in docs/DEPLOYMENT.md.
  #   4. Include the before/after sizes in the PR description.
  WASM_SIZE_LIMIT: 204800  # 200 KB hard limit

jobs:
  quality:
    name: Format, Lint, Test, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check ABI changelog
        run: bash scripts/check_changelog_abi.sh "${{ github.event.pull_request.base.sha || github.event.before }}"

      - name: Check generated ABI JSON is current
        run: |
          make abi
          git diff --exit-code -- docs/abi.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install wasm targets
        run: rustup target add wasm32v1-none wasm32-unknown-unknown

      # stellar-cli native deps:
      # - libdbus-1-dev: libdbus-sys (keyring)
      # - libudev-dev: hidapi (hardware wallet support)
      # - pkg-config: locates both via .pc files
      - name: Install system deps for Stellar CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libudev-dev pkg-config

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli@26.1.0

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      - name: stellar contract build
        run: stellar contract build

      - name: Verify WASM size budget
        run: |
          if [ -f target/wasm32v1-none/release/trustbridge_contract.wasm ]; then
            WASM=target/wasm32v1-none/release/trustbridge_contract.wasm
          elif [ -f target/wasm32-unknown-unknown/release/trustbridge_contract.wasm ]; then
            WASM=target/wasm32-unknown-unknown/release/trustbridge_contract.wasm
          else
            echo "ERROR: No release WASM artifact found."
            exit 1
          fi
          SIZE=$(wc -c < "$WASM")
          echo "WASM size: $SIZE bytes"
          echo "WASM budget: $WASM_SIZE_LIMIT bytes"
          if [ "$SIZE" -gt "$WASM_SIZE_LIMIT" ]; then
            echo "ERROR: WASM size exceeds the documented budget by $(( SIZE - WASM_SIZE_LIMIT )) bytes."
            echo "Inspect locally with: make wasm-size"
            exit 1
          fi
          echo "OK: WASM size is within budget."

      # Cargo emits underscores for hyphenated crate names (trustbridge-contract → trustbridge_contract.wasm)
      - name: Verify WASM artifact exists
        run: test -f target/wasm32v1-none/release/trustbridge_contract.wasm || test -f target/wasm32-unknown-unknown/release/trustbridge_contract.wasm

      - name: Generate TypeScript bindings
        run: |
          if [ -f target/wasm32v1-none/release/trustbridge_contract.wasm ]; then
            WASM=target/wasm32v1-none/release/trustbridge_contract.wasm
          else
            WASM=target/wasm32-unknown-unknown/release/trustbridge_contract.wasm
          fi
          make bindings WASM="$WASM"

      - name: Upload TypeScript bindings artifact
        uses: actions/upload-artifact@v4
        with:
          name: trustbridge-typescript-bindings
          path: bindings/typescript
          if-no-files-found: error
          retention-days: 14

      - name: Compute and verify WASM hash pin
        run: |
          if [ -f target/wasm32v1-none/release/trustbridge_contract.wasm ]; then
            WASM=target/wasm32v1-none/release/trustbridge_contract.wasm
          else
            WASM=target/wasm32-unknown-unknown/release/trustbridge_contract.wasm
          fi
          ACTUAL=$(sha256sum "$WASM" | awk '{print $1}')
          echo "WASM SHA-256: $ACTUAL"
          PINNED=$(grep -v '^#' wasm-hash.pin | grep -v '^$' | tr -d '[:space:]')
          if [ "$PINNED" = "PLACEHOLDER" ]; then
            echo "WARNING: wasm-hash.pin contains PLACEHOLDER — skipping hash comparison."
            echo "Run 'make wasm-hash-update' after building to pin the current hash."
          elif [ "$ACTUAL" != "$PINNED" ]; then
            echo "ERROR: WASM hash mismatch!"
            echo "  Expected (pinned): $PINNED"
            echo "  Actual:            $ACTUAL"
            echo "If this change is intentional, run 'make wasm-hash-update' locally,"
            echo "commit the updated wasm-hash.pin, and open a PR with the new hash."
            exit 1
          else
            echo "OK: WASM hash matches pin ($ACTUAL)"
          fi

      - name: cargo doc (public API)
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  wasm-integration-test:
    name: WASM Upgrade Integration Tests
    runs-on: ubuntu-latest
    needs: quality
    if: always() && !cancelled()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm targets
        run: rustup target add wasm32v1-none wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build WASM artifact
        run: |
          cargo build --target wasm32v1-none --release

      - name: Run WASM upgrade integration tests
        run: |
          cargo test --features wasm-test --test integration -- \
            test_integration_wasm_upgrade_cooldown --nocapture --exact

      - name: Verify WASM test ran
        run: |
          cargo test --features wasm-test --test integration -- \
            test_integration_wasm_upgrade_cooldown -- --list | grep "test_integration_wasm_upgrade_cooldown"

  # Issue #248: Coverage gate for storage.rs helpers (dead_code hygiene)
  #
  # Measures per-file line coverage using cargo-tarpaulin and emits a summary
  # so reviewers can see whether storage.rs helpers are reached by tests.
  # The job is informational on PRs — it annotates without blocking merge —
  # but a sustained drop below 60% line coverage for storage.rs triggers a
  # review flag.
  #
  # Tool choice: cargo-tarpaulin (x86_64-unknown-linux-gnu, no WASM needed).
  # Alternative: `cargo llvm-cov --lib` (requires llvm-tools-preview).
  # Run locally: cargo tarpaulin --lib --include-files 'src/storage.rs'
  storage-coverage:
    name: storage.rs Coverage Gate (Issue #248)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-tarpaulin-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-tarpaulin
        run: cargo install --locked cargo-tarpaulin

      - name: Run coverage for storage.rs
        run: |
          mkdir -p coverage
          cargo tarpaulin \
            --lib \
            --engine ptrace \
            --include-files 'src/storage.rs' \
            --out Json \
            --output-dir coverage \
            --timeout 120 \
            2>&1 | tee coverage/tarpaulin.log

      - name: Check storage.rs coverage threshold (60% line coverage)
        run: |
          python3 -c "
          import json, sys, os
          report = 'coverage/tarpaulin-report.json'
          if not os.path.exists(report):
              print('WARNING: coverage report not found — skipping threshold check.')
              sys.exit(0)
          data = json.load(open(report))
          files = data.get('files', [])
          for f in files:
              if 'storage.rs' in f.get('path', ''):
                  traces  = f.get('traces', [])
                  total   = len(traces)
                  covered = sum(1 for t in traces if t.get('stats', {}).get('Line', 0) > 0)
                  pct     = (covered / total * 100) if total else 0.0
                  print(f'storage.rs line coverage: {pct:.1f}% ({covered}/{total})')
                  if pct < 60.0:
                      print('WARNING: coverage is below 60% — review #[allow(dead_code)] helpers.')
                  else:
                      print('OK: coverage meets 60% threshold.')
                  sys.exit(0)
          print('WARNING: storage.rs not found in coverage report.')
          "

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: storage-coverage-report
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  # Issue #244: Supply-chain audit and license/ban policy  supply-chain:
    name: Supply-Chain Audit (cargo-deny + cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      - name: cargo audit
        run: cargo audit

      - name: cargo deny check
        run: cargo deny check

  # Issue #245: Clippy pedantic — Phase 1 lints promoted to deny
  clippy-pedantic:
    name: Clippy Pedantic (Phase 1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install wasm targets
        run: rustup target add wasm32v1-none wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-pedantic-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: clippy pedantic (Phase 1 — deny)
        run: |
          cargo clippy --all-targets -- \
            -D warnings \
            -D clippy::must_use_candidate \
            -D clippy::missing_errors_doc \
            -D clippy::missing_panics_doc \
            -D clippy::redundant_closure_for_method_calls \
            -D clippy::cloned_instead_of_copied


  # Issue #243: Mutation-testing gate for utils.rs username validation
  #
  # Username rules are a security boundary: homoglyph rejection, hyphen rules,
  # consecutive-hyphen guard. A weakened check can pass normal unit tests but
  # is caught by mutation testing. This job:
  #   - runs cargo-mutants scoped to src/utils.rs only (bounded CI time)
  #   - fails if any mutant survives (i.e. the test suite did not detect it)
  #   - skips unviable/timeout mutants (not failures — compile errors in no_std)
  #
  # Run locally:
  #   cargo install cargo-mutants
  #   cargo mutants --file src/utils.rs
  #
  # Configuration is in mutants.toml at the repository root.
  mutation-testing:
    name: Mutation Testing — utils.rs (Issue #243)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-mutants-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-mutants
        run: cargo install --locked cargo-mutants

      # Run mutations scoped to src/utils.rs.
      # Exit code semantics for cargo-mutants:
      #   0 — all mutants caught or unviable (test suite is adequate)
      #   2 — one or more mutants survived (test suite gap detected)
      #   other — tool error
      #
      # We capture the output and also write the mutants-out directory so the
      # results can be inspected via the uploaded artifact.
      - name: Run mutation tests on utils.rs
        run: |
          cargo mutants \
            --file src/utils.rs \
            --output mutants-out \
            --timeout 120 \
            2>&1 | tee mutants-out/mutation-run.log
          EXIT=${PIPESTATUS[0]}
          echo "cargo-mutants exit code: $EXIT"
          if [ "$EXIT" -eq 2 ]; then
            echo "ERROR: One or more mutants in src/utils.rs survived."
            echo "Surviving mutants represent gaps in the utils.rs test suite."
            echo "See the mutants-out/ directory or the uploaded artifact for details."
            cat mutants-out/mutation-run.log || true
            exit 2
          elif [ "$EXIT" -ne 0 ]; then
            echo "ERROR: cargo-mutants exited with unexpected code $EXIT."
            exit "$EXIT"
          fi
          echo "OK: all utils.rs mutants were caught by the test suite."

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-testing-results
          path: mutants-out/
          if-no-files-found: warn
          retention-days: 14
