name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * *" # nightly mutation run
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  STELLAR_CLI_VERSION: "26.1.0"

jobs:
  check:
    name: Basic checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -- --check

  clippy:
    name: Clippy deny warnings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: cargo-check-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Run clippy with denied warnings
        run: cargo clippy --all-targets -- -D warnings

  abi-consistency:
    name: Error codes and event topics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same scripts as `make error-codes` / `make event-topics`.
      - name: Check error codes
        run: ./scripts/check_error_codes.sh

      - name: Check event topics
        run: ./scripts/check_event_topics.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Regenerate ABI JSON then validate snapshot
        run: |
          python3 scripts/generate_abi_json.py
          python3 scripts/generate_abi_json.py --self-test
          python3 scripts/generate_abi_json.py --check
          cargo test --test abi_entrypoints_golden -- --nocapture

  build:
    name: Soroban contract build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Install Stellar CLI
        run: |
          curl -sSLf https://github.com/stellar/stellar-cli/releases/download/v${{ env.STELLAR_CLI_VERSION }}/stellar-cli-${{ env.STELLAR_CLI_VERSION }}-x86_64-unknown-linux-gnu.tar.gz | tar xz
          sudo mv stellar /usr/local/bin/

      - name: Cache cargo and wasm32v1-none artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: soroban-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ env.STELLAR_CLI_VERSION }}

      - name: Build WASM (stellar contract build)
        run: make build

      - name: Check WASM size
        run: make wasm-size

      - name: Verify WASM hash
        run: make wasm-hash-pin WASM_HASH_STRICT=1

  oracle-proof-tests:
    name: oracle_proof unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: cargo-check-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Run oracle_proof module tests
        run: cargo test --lib oracle_proof

  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Caches the installed cargo-deny binary between runs.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: cargo-deny-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny@0.20.2

      # Advisory DB cache; cargo-deny refreshes it on every run.
      - name: Cache advisory database
        uses: actions/cache@v4
        with:
          path: ~/.cargo/advisory-dbs
          key: advisory-db-${{ github.run_id }}
          restore-keys: advisory-db-

      - name: cargo deny check
        run: cargo deny --config deny.toml check

  mutants:
    name: cargo mutants (src/utils.rs)
    # CPU-heavy: nightly and on demand only, never on pull requests.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: cargo-mutants-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Install cargo-mutants
        run: cargo install --locked cargo-mutants@27.1.0

      # Scope and test selection come from mutants.toml (cargo-mutants only
      # reads .cargo/mutants.toml by default). Exit 2 means survived
      # ("missed") mutants and fails the job; exit 3 means only timeouts,
      # which mutants.toml documents as not failures.
      - name: cargo mutants --file src/utils.rs
        run: |
          status=0
          cargo mutants --config mutants.toml --file src/utils.rs || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then exit "$status"; fi

      - name: Upload survived mutants
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-survived
          path: |
            mutants.out/missed.txt
            mutants.out/outcomes.json
          if-no-files-found: warn
