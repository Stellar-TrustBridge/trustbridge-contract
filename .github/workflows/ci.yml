name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  STELLAR_CLI_VERSION: 26.1.0

jobs:
  quality:
    name: Quality gate (fmt, clippy, test, docs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: make fmt

      - name: Clippy
        run: make lint

      - name: Test
        run: make test

      - name: Rustdoc
        run: make docs-check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ts-differential-tests/package-lock.json

      - name: Install locked dependencies
        working-directory: ts-differential-tests
        run: npm ci

      - name: Compare JS decoding with Rust golden
        working-directory: ts-differential-tests
        run: npm test

  build:
    name: Contract build + WASM hash gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none, wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Stellar CLI
        run: |
          test -f Cargo.toml
          test -f rust-toolchain.toml
          test -f src/lib.rs
          test -f README.md
          test -f Makefile

      - name: Check storage-rent estimator golden
        run: bash scripts/test_storage_rent_estimator.sh
