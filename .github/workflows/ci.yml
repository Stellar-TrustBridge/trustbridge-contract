name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Basic checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt -- --check

  diff-test:
    name: TypeScript differential tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Rust/TS fixture pairing
        if: github.event_name == 'pull_request'
        run: scripts/check_fixture_pairing.sh "origin/${{ github.base_ref }}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ts-differential-tests/package-lock.json

      - name: Run differential tests
        run: set -o pipefail; make diff-test 2>&1 | tee diff-test-output.txt

      - name: Upload differential test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diff-test-output
          path: diff-test-output.txt
          retention-days: 14
